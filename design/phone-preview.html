<title>IT Hub Phone Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a slim control bar over a phone-sized frame; on a real phone the frame fills the screen. */
:root {
  --bg: #e9edf5;
  --bar: #0f172a;
  --bar-fg: #e2e8f0;
  --bar-muted: #94a3b8;
  --accent: #2563eb;
  --bezel: #0b1120;
  --toast-bg: #0f172a;
  --toast-fg: #f8fafc;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #060a14; --bezel: #1e293b; --toast-bg: #e2e8f0; --toast-fg: #0f172a; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #060a14; --bezel: #1e293b; --toast-bg: #e2e8f0; --toast-fg: #0f172a; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); font-family: var(--font); display: flex; flex-direction: column; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bar); color: var(--bar-fg);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-size: 13px;
}
.bar strong { font-weight: 700; }
.bar .hint { color: var(--bar-muted); margin-right: auto; }
.bar button, .bar select {
  font: inherit; color: var(--bar-fg); background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 6px 10px;
}
.bar button { cursor: pointer; }
.bar button:disabled { opacity: .45; cursor: default; }
.bar select { max-width: 100%; min-width: 0; flex: 1 1 200px; }
.bar :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.who { display: inline-flex; border: 1px solid #334155; border-radius: 999px; overflow: hidden; }
.who button { border: 0; border-radius: 0; background: none; padding: 5px 12px; }
.who button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.stage { flex: 1; display: grid; place-items: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; min-height: 0; }
.phone { width: 390px; height: 844px; max-height: calc(100vh - 120px); border: 12px solid var(--bezel); border-radius: 46px; overflow: hidden; background: #fff; box-shadow: 0 30px 60px -30px rgba(15, 23, 42, .5); position: relative; }
.phone iframe { width: 100%; height: 100%; border: 0; display: block; background: #f4f6fb; }
.toast { position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%); width: min(340px, calc(100% - 32px)); background: var(--toast-bg); color: var(--toast-fg); padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.4; z-index: 3; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .4); }
@media (max-width: 520px) {
  .stage { padding: 0; place-items: stretch; }
  .phone { width: 100%; height: auto; max-height: none; border: 0; border-radius: 0; box-shadow: none; }
  .bar .hint { display: none; }
  .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="bar">
  <strong>IT Hub preview</strong>
  <span class="hint">Real screens with example data. Tap around; nothing saves.</span>
  <div class="who" role="group" aria-label="View as">
    <button id="as-it" aria-pressed="true">IT team</button>
    <button id="as-staff" aria-pressed="false">Staff</button>
    <button id="as-out" aria-pressed="false">Signed out</button>
  </div>
  <button id="back" disabled aria-label="Back">‹ Back</button>
  <select id="screen" aria-label="Go to screen"></select>
</div>
<main class="stage">
  <div class="phone"><iframe id="frame" title="IT Hub screen"></iframe></div>
  <div class="toast" id="toast" role="status" hidden></div>
</main>

ettings.<\/p><\/section><\/div><!--$--><!--/$--><\/main><\/div><nav class=\"tabbar\" aria-label=\"Main\"><a href=\"/it\"><svg class=\"i \" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"9\" rx=\"1\"><\/rect><rect x=\"14\" y=\"3\" width=\"7\" height=\"5\" rx=\"1\"><\/rect><rect x=\"14\" y=\"12\" width=\"7\" height=\"9\" rx=\"1\"><\/rect><rect x=\"3\" y=\"16\" width=\"7\" height=\"5\" rx=\"1\"><\/rect><\/svg><span>Home<\/span><\/a><a href=\"/it/tickets\"><svg class=\"i \" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z\"><\/path><path d=\"M13 6v12\" stroke-dasharray=\"2 2\"><\/path><\/svg><span>Tickets<\/span><\/a><a href=\"/it/scan\"><svg class=\"i \" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"><\/rect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"><\/rect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"><\/rect><path d=\"M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3\"><\/path><\/svg><span>Scan<\/span><\/a><a href=\"/it/assets\"><svg class=\"i \" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 8 12 3 3 8v8l9 5 9-5z\"><\/path><path d=\"M3 8l9 5 9-5M12 13v8\"><\/path><\/svg><span>Kit<\/span><\/a><a href=\"/it/stock\"><svg class=\"i \" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m12 3 9 5-9 5-9-5z\"><\/path><path d=\"m3 13 9 5 9-5\"><\/path><\/svg><span>Stock<\/span><\/a><\/nav><\/div>"}}}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const frame = document.getElementById("frame");
const select = document.getElementById("screen");
const backBtn = document.getElementById("back");
const toastEl = document.getElementById("toast");
const HOME = { admin: "/it", staff: "/my", anon: "/sign-in" };
let current = null;
const trail = [];

// Screen picker, grouped by who sees each screen.
const groups = { admin: "IT team", staff: "Staff", anon: "Signed out" };
for (const [who, label] of Object.entries(groups)) {
  const og = document.createElement("optgroup");
  og.label = label;
  for (const [key, p] of Object.entries(DATA.pages)) {
    if (p.who !== who || key === "/it?menu") continue;
    const o = document.createElement("option");
    o.value = key;
    o.textContent = p.title;
    og.appendChild(o);
  }
  select.appendChild(og);
}

let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (toastEl.hidden = true), 2600);
}

const extraCss = "html,body{min-height:100%} a,button,summary,label{-webkit-tap-highlight-color:transparent}";
function docFor(p) {
  return '<!doctype html><html lang="en-GB" class="' + DATA.htmlClass + '"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' +
    DATA.css + extraCss + "</style></head><body>" + p.html.split("__LOGO__").join(DATA.logo) + "</body></html>";
}

function setWho(who) {
  for (const [id, w] of [["as-it", "admin"], ["as-staff", "staff"], ["as-out", "anon"]]) document.getElementById(id).setAttribute("aria-pressed", String(w === who));
}

function show(key, remember = true) {
  const p = DATA.pages[key];
  if (!p) return false;
  if (remember && current && current !== key) trail.push(current);
  current = key;
  backBtn.disabled = trail.length === 0;
  if (key !== "/it?menu") select.value = key;
  setWho(p.who);
  frame.srcdoc = docFor(p);
  try { localStorage.setItem("ithub-preview-screen", key); } catch (_) {}
  return true;
}

/** Works out which captured screen a link inside the app points to. */
function route(href) {
  let url;
  try { url = new URL(href, "http://app.local" + (current || "/")); } catch (_) { return null; }
  if (!/^https?:$/.test(url.protocol)) return null;
  if (url.host !== "app.local" && url.host !== "localhost:3200") return { external: url.href };
  const path = url.pathname.replace(/\/$/, "") || "/";
  const full = path + url.search;
  if (DATA.pages[full]) return { key: full };
  if (path === "/" ) return { key: HOME[DATA.pages[current]?.who || "admin"] };
  if (path === "/it/tickets" && url.searchParams.get("view") === "open") return { key: "/it/tickets" };
  if (DATA.pages[path]) return { key: path };
  if (path.startsWith("/invite/")) return { key: "/invite/demo" };
  return { missing: full };
}

frame.addEventListener("load", () => {
  const doc = frame.contentDocument;
  if (!doc) return;
  doc.addEventListener("click", (e) => {
    const t = e.target;
    const a = t.closest && t.closest("a[href]");
    if (a) {
      e.preventDefault();
      const r = route(a.getAttribute("href"));
      if (!r) return;
      if (r.key) show(r.key);
      else if (r.external) toast("That opens " + r.external.replace(/^https?:\/\//, "") + " in the real app (e.g. a printer's own web page).");
      else toast("That screen isn't in this preview. In the real app it opens " + r.missing + ".");
      return;
    }
    const b = t.closest && t.closest("button");
    if (!b) return;
    const label = (b.getAttribute("aria-label") || b.textContent || "").trim();
    if (label === "Menu") {
      e.preventDefault();
      show(current === "/it?menu" ? (trail[trail.length - 1] || "/it") : "/it?menu");
      return;
    }
    if (label === "Sign out") {
      e.preventDefault();
      trail.length = 0;
      show("/sign-in", false);
      backBtn.disabled = true;
      return;
    }
    if (b.type === "button" && !b.closest("form")?.matches(".prio-pick")) {
      if (/^Continue with/.test(label)) { e.preventDefault(); toast("In the real app this signs you in with " + label.replace("Continue with ", "") + "."); return; }
      if (/Check out to someone|Edit|Internal note|Reply|Kit|Cupboard stock|Copy|Print/.test(label)) { e.preventDefault(); toast("“" + label + "” works in the real app; this preview only shows screens."); }
    }
  });
  doc.addEventListener("submit", (e) => {
    e.preventDefault();
    const f = e.target;
    const btn = e.submitter ? (e.submitter.textContent || "").trim() : "";
    if (f.querySelector("#si-email")) { show("/my"); toast("Signed in (preview). Staff land on My jobs; the IT team land on the dashboard."); return; }
    if (f.querySelector("#su-name")) { show("/my"); toast("Account created (preview)."); return; }
    toast((btn ? "“" + btn + "”" : "That") + " saves in the real app. Nothing is saved in this preview.");
  }, true);
  // Selects that save on change in the real app.
  doc.addEventListener("change", (e) => {
    const s = e.target;
    if (s.tagName === "SELECT" && s.closest("form") && s.form && s.form.querySelector('input[name="ticketId"]') && s.name !== "priority" ) toast("Changing this saves straight away in the real app.");
  });
});

select.addEventListener("change", () => show(select.value));
backBtn.addEventListener("click", () => {
  const prev = trail.pop();
  if (prev) show(prev, false);
  backBtn.disabled = trail.length === 0;
});
document.getElementById("as-it").addEventListener("click", () => show("/it"));
document.getElementById("as-staff").addEventListener("click", () => show("/my"));
document.getElementById("as-out").addEventListener("click", () => show("/sign-in"));

let start = "/it";
try { const s = localStorage.getItem("ithub-preview-screen"); if (s && DATA.pages[s]) start = s; } catch (_) {}
show(start, false);
</script>
