<title>IT Hub Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: app shell — left nav rail on desktop, bottom tab bar on phones; content is a single scrolling column of panels.
   Three style directions share one token set: "clean" (default), "console" (dense ops), "soft" (rounded, friendly).
   --brand is the company colour and can be changed live from the preview bar. */
:root {
  --brand: #2f7a4d;
  --bg: #f6f7f6;
  --surface: #ffffff;
  --surface-2: #f0f2f0;
  --line: #e1e5e2;
  --fg: #18201b;
  --muted: #5d6a62;
  --ok: #1f8a4c;
  --warn: #b26a00;
  --bad: #c23b32;
  --info: #2c62b8;
  --on-brand: #ffffff;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 8px;
  --radius-sm: 6px;
  --pad: 16px;
  --row: 52px;
  --shadow: 0 1px 2px rgba(20, 30, 24, .06);
  --brand-soft: color-mix(in srgb, var(--brand) 12%, var(--surface));
  --brand-line: color-mix(in srgb, var(--brand) 35%, var(--line));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #181d1a; --surface-2: #1f2521; --line: #2c3430;
    --fg: #e6ece8; --muted: #95a39b; --ok: #4cc27f; --warn: #e3a33b; --bad: #f0766c; --info: #79a6ef;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #181d1a; --surface-2: #1f2521; --line: #2c3430;
  --fg: #e6ece8; --muted: #95a39b; --ok: #4cc27f; --warn: #e3a33b; --bad: #f0766c; --info: #79a6ef;
  --shadow: none; color-scheme: dark;
}

/* Console: dense, square, ops-room feel */
:root[data-style="console"] {
  --bg: #eef0f2; --surface: #ffffff; --surface-2: #e7eaed; --line: #d3d8dd;
  --fg: #12171c; --muted: #56616c;
  --font-ui: "IBM Plex Sans", system-ui, sans-serif;
  --font-display: "IBM Plex Sans", system-ui, sans-serif;
  --radius: 2px; --radius-sm: 2px; --pad: 12px; --row: 40px; --shadow: none;
}
@media (prefers-color-scheme: dark) {
  :root[data-style="console"]:not([data-theme="light"]) {
    --bg: #0b0e11; --surface: #12161a; --surface-2: #181d22; --line: #262d34;
    --fg: #dfe5ea; --muted: #8592a0; color-scheme: dark;
  }
}
:root[data-style="console"][data-theme="dark"] {
  --bg: #0b0e11; --surface: #12161a; --surface-2: #181d22; --line: #262d34;
  --fg: #dfe5ea; --muted: #8592a0; color-scheme: dark;
}

/* Soft: roomy, rounded, friendly */
:root[data-style="soft"] {
  --bg: #f3f5ef; --surface: #fdfdfb; --surface-2: #ecefe6; --line: #e0e4d8;
  --fg: #1d241c; --muted: #616b5d;
  --font-ui: "Nunito Sans", system-ui, sans-serif;
  --font-display: "Bricolage Grotesque", "Nunito Sans", system-ui, sans-serif;
  --radius: 18px; --radius-sm: 12px; --pad: 20px; --row: 60px;
  --shadow: 0 6px 20px -12px rgba(40, 60, 30, .25);
}
@media (prefers-color-scheme: dark) {
  :root[data-style="soft"]:not([data-theme="light"]) {
    --bg: #141712; --surface: #1c2019; --surface-2: #242920; --line: #30362b;
    --fg: #e8ece2; --muted: #9ea896; --shadow: none; color-scheme: dark;
  }
}
:root[data-style="soft"][data-theme="dark"] {
  --bg: #141712; --surface: #1c2019; --surface-2: #242920; --line: #30362b;
  --fg: #e8ece2; --muted: #9ea896; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1rem; font-weight: 600; }
h3 { font-size: .9rem; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-size: .9em; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }

/* ---------- preview bar (design tool, not part of the app) ---------- */
.preview {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--fg); color: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: .8rem;
}
.preview strong { font-weight: 600; margin-right: auto; }
.seg { display: inline-flex; border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); border-radius: 999px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 10px; color: inherit; opacity: .75; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); opacity: 1; }
.preview label { display: inline-flex; align-items: center; gap: 6px; }
.preview input[type="color"] { width: 26px; height: 22px; border: 0; padding: 0; background: none; }
.preview input[type="text"] { width: 120px; padding: 3px 8px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); background: transparent; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100% - 44px); }
.nav {
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 16px 12px; display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 44px; height: calc(100vh - 44px); align-self: start;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.logo {
  width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--brand); color: var(--on-brand);
  display: grid; place-items: center; font-weight: 700; font-family: var(--font-display); flex: none;
}
.brand-name { font-family: var(--font-display); font-weight: 700; line-height: 1.1; }
.brand-sub { font-size: .75rem; color: var(--muted); }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm);
  color: var(--muted); text-decoration: none; font-weight: 500;
}
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a[aria-current="page"] { background: var(--brand-soft); color: var(--fg); }
.nav a[aria-current="page"] svg { color: var(--brand); }
.nav .count { margin-left: auto; font-size: .75rem; background: var(--surface-2); padding: 0 7px; border-radius: 999px; }
.nav .spacer { flex: 1; }
.nav .me { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-top: 1px solid var(--line); }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: .72rem; font-weight: 700; flex: none; border: 1px solid var(--line); }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

main {
  min-width: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.page { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; justify-content: space-between; }
.page-head .sub { color: var(--muted); margin-top: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .85rem; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.primary:hover { background: color-mix(in srgb, var(--brand) 88%, black); }
.btn svg.i { width: 16px; height: 16px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px var(--pad); border-bottom: 1px solid var(--line); }
.panel-body { padding: var(--pad); }
.grid { display: grid; gap: 16px; }
.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-main { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.kpi { padding: var(--pad); display: flex; flex-direction: column; gap: 6px; }
.kpi .v { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: .8rem; color: var(--muted); }
.kpi.alert .v { color: var(--bad); }
.kpi.warn .v { color: var(--warn); }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.plain::before { display: none; }
.s-new { color: var(--info); background: color-mix(in srgb, var(--info) 12%, var(--surface)); }
.s-progress { color: var(--brand); background: var(--brand-soft); }
.s-waiting { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); }
.s-resolved, .s-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
.s-closed { color: var(--muted); }
.s-bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.prio { font-family: var(--font-mono); font-size: .72rem; font-weight: 500; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; }
.p1 { color: var(--bad); } .p2 { color: var(--warn); } .p3 { color: var(--info); } .p4 { color: var(--muted); }

/* list rows */
.rows { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: 4px 88px minmax(0, 1fr) 120px 110px 120px; align-items: center; gap: 12px;
  min-height: var(--row); padding: 8px var(--pad) 8px 0; border-bottom: 1px solid var(--line);
  background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%;
}
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface-2); }
.row .stripe { align-self: stretch; border-radius: 0 3px 3px 0; }
.row .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sla { font-size: .8rem; font-variant-numeric: tabular-nums; }
.row .who { display: flex; align-items: center; gap: 6px; font-size: .82rem; min-width: 0; }
.bg-p1 { background: var(--bad); } .bg-p2 { background: var(--warn); } .bg-p3 { background: var(--info); } .bg-p4 { background: var(--line); }
.sla.late { color: var(--bad); font-weight: 600; }
.sla.soon { color: var(--warn); font-weight: 600; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px var(--pad); border-bottom: 1px solid var(--line); }
.search { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); flex: 1 1 200px; color: var(--muted); }
.search input { border: 0; outline: 0; background: none; width: 100%; color: var(--fg); }
.filter { padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); font-size: .82rem; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { padding: 6px 12px; border-radius: var(--radius-sm); border: 0; background: none; color: var(--muted); font-weight: 600; font-size: .85rem; }
.tab[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }

/* chart */
.bars { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; align-items: end; height: 120px; padding-top: 8px; }
.bars div { background: color-mix(in srgb, var(--brand) 55%, var(--surface)); border-radius: 3px 3px 0 0; position: relative; min-height: 2px; }
.bars div.today { background: var(--brand); }
.bar-axis { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; font-size: .68rem; color: var(--muted); text-align: center; margin-top: 6px; }
.gridline { border-top: 1px dashed var(--line); }

/* key-value */
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 12px; font-size: .86rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* ticket detail */
.shot { border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface-2); aspect-ratio: 16/10; max-width: 100%; display: flex; flex-direction: column; }
.shot .bar { height: 14px; background: var(--line); display: flex; gap: 4px; align-items: center; padding: 0 6px; }
.shot .bar i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); opacity: .5; }
.shot .body { flex: 1; padding: 8px; display: grid; gap: 5px; align-content: start; }
.shot .body span { height: 6px; border-radius: 3px; background: var(--line); }
.shot .err { margin: 6px auto 0; width: 70%; border: 1px solid var(--bad); border-radius: 4px; padding: 6px; font-size: .62rem; color: var(--bad); background: var(--surface); text-align: center; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.thread { display: flex; flex-direction: column; gap: 14px; }
.msg { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.msg .bubble { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; }
.msg.internal .bubble { background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border: 1px dashed color-mix(in srgb, var(--warn) 50%, var(--line)); }
.msg .h { font-size: .78rem; color: var(--muted); margin-bottom: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
.composer { border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.composer textarea { width: 100%; border: 0; min-height: 80px; padding: 10px 12px; resize: vertical; background: var(--surface); outline: 0; }
.composer .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; padding: 8px; border-top: 1px solid var(--line); background: var(--surface-2); }
.timer { display: flex; flex-direction: column; gap: 4px; }
.meter { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; background: var(--ok); }
.meter i.warn { background: var(--warn); } .meter i.bad { background: var(--bad); }

/* inventory */
.assets { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; padding: var(--pad); }
.asset { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.asset:hover { border-color: var(--brand-line); }
.asset .ph { aspect-ratio: 4/3; border-radius: calc(var(--radius-sm) - 2px); background: var(--surface-2); display: grid; place-items: center; color: var(--muted); max-width: 100%; }
.asset .ph svg.i { width: 40px; height: 40px; stroke-width: 1.2; }
.asset .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.stock { display: flex; align-items: center; gap: 8px; font-size: .8rem; }
.stock .meter { flex: 1; }

/* printers / network tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 10px var(--pad); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px var(--pad); border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
.copy { border: 0; background: none; color: var(--muted); padding: 2px 4px; border-radius: 4px; font-size: .75rem; }
.copy:hover { background: var(--surface-2); color: var(--fg); }
.toner { display: flex; gap: 3px; align-items: end; height: 22px; }
.toner i { width: 7px; border-radius: 2px; background: var(--surface-2); position: relative; height: 100%; overflow: hidden; }
.toner i b { position: absolute; inset: auto 0 0; display: block; }

.site { display: flex; flex-direction: column; gap: 12px; }
.site .stat { display: flex; justify-content: space-between; font-size: .85rem; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.site .stat:last-child { border-bottom: 0; }
.topo { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0; font-size: .75rem; }
.topo .node { padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); display: flex; align-items: center; gap: 6px; }
.topo .node.down { border-color: var(--bad); color: var(--bad); }
.topo .link { width: 1px; height: 12px; background: var(--line); }
.topo .tier { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }

/* forms */
.form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: .86rem; }
.field .hint { font-size: .78rem; color: var(--muted); }
.input, .form select, .form textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface);
}
.form textarea { min-height: 110px; resize: vertical; }
.drop { border: 1.5px dashed var(--brand-line); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--muted); background: var(--brand-soft); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.prio-pick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.prio-pick button { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); padding: 10px 8px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.prio-pick button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.prio-pick small { color: var(--muted); font-size: .72rem; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

.steps { display: flex; flex-direction: column; gap: 0; }
.step { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; padding-bottom: 16px; position: relative; }
.step::before { content: ""; position: absolute; left: 9px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
.step:last-child::before { display: none; }
.step .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.step.done .dot { background: var(--brand); border-color: var(--brand); }
.step.now .dot { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }

/* settings table */
.rules td, .rules th { white-space: normal; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); font-size: .78rem; margin: 1px 2px 1px 0; }
.toggle { width: 36px; height: 20px; border-radius: 999px; background: var(--line); position: relative; border: 0; flex: none; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.toggle[aria-pressed="true"] { background: var(--brand); }
.toggle[aria-pressed="true"]::after { left: 18px; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }

/* modal / drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 15, 12, .45); z-index: 30; display: flex; justify-content: flex-end; }

  return `<div class="toner" title="${cols.map(([k]) => k.toUpperCase() + ' ' + p[k] + '%').join(', ')}">${cols.map(([k, c]) => `<i><b style="height:${p[k]}%;background:${c}"></b></i>`).join('')}<span class="num muted" style="font-size:.75rem;margin-left:6px">${Math.min(...cols.map(([k]) => p[k]))}%</span></div>`;
}

      <label class="drop" for="f-file">${ic('camera')}<strong>Add screenshots or take a photo</strong><span style="font-size:.8rem">Paste, drag in, or tap to choose. Up to 5 images.</span></label>
      <input type="file" id="f-file" accept="image/*" multiple hidden></div>
    <div class="two">
      <div class="field"><label for="f-site">Site</label><select id="f-site">${SITES.map(s => `<option ${s === 'Warehouse' ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label for="f-loc">Where exactly?</label><input class="input" id="f-loc" value="Dispatch bench 2"></div>
    </div>
    <div class="field"><label>How urgent is it?</label><div class="prio-pick">
      ${[[1, 'Critical', 'Work has stopped'], [2, 'High', 'Hard to work'], [3, 'Normal', 'Annoying'], [4, 'Low', 'Whenever']].map(([n, l, d]) => `<button type="button" data-prio="${n}" aria-pressed="${S.prio === n}"><span>${prio(n)} <strong>${l}</strong></span><small>${d}</small></button>`).join('')}
    </div></div>
    <div class="field"><label for="f-phone">Best number to reach you</label><input class="input mono" id="f-phone" inputmode="tel" value="07700 900412"><span class="hint">Only IT can see this.</span></div>
    <div class="actions"><button class="btn primary" type="submit">Send to IT</button></div>
  </form>
</div>`;

/* ---------------- sign-in ---------------- */
function signin() {
  const it = S.signinAs === 'tech';
  return `<div class="signin">
    <div class="side"><div class="brand" style="padding:0"><div class="logo">${initials(brand())}</div><div class="brand-name">${brand()}</div></div>
      <div><h1>${it ? 'IT team sign-in' : 'Get IT help, fast'}</h1><p style="margin-top:10px">${it ? 'Tickets, inventory, printers and the network for all three sites.' : 'Raise a job, add a screenshot and see exactly where it is up to.'}</p></div>
      <p class="hide-sm" style="font-size:.8rem">Logo and colours here come from your company branding.</p></div>
    <div class="form-side"><form class="card" id="signinForm">
      <div class="who-tabs" role="group" aria-label="Sign in as"><button type="button" data-as="staff" aria-pressed="${!it}">Staff</button><button type="button" data-as="tech" aria-pressed="${it}">IT team</button></div>
      <button type="button" class="sso" data-signin>${ic('slack')}Continue with Slack</button>
      <button type="button" class="sso" data-signin>${ic('globe')}Continue with Google</button>
      <button type="button" class="sso" data-signin>${ic('key')}Continue with Microsoft</button>
      <div class="or">or use email</div>
      <div class="form" style="gap:10px"><input class="input" id="si-email" type="email" placeholder="you@company.co.uk" aria-label="Email"><input class="input" id="si-pass" type="password" placeholder="Password" aria-label="Password"></div>
      <button class="btn primary" type="submit" style="justify-content:center;padding:10px">Sign in</button>
      ${it ? '<p class="note">IT accounts need an IT role and a second sign-in step (an authenticator code). Staff accounts can only see their own jobs.</p>' : ''}
    </form></div>
  </div>`;
}

/* ---------------- render + events ---------------- */
function render() {
  const app = $('#app');
  if (S.role === 'signin') { app.innerHTML = signin(); return; }
  if (!NAV[S.role].some(([k]) => k === S.page)) S.page = NAV[S.role][0][0];
  app.innerHTML = shell(pages[S.page]());
}
function setPressed(attr, val) { document.querySelectorAll(`[${attr}]`).forEach(b => b.setAttribute('aria-pressed', b.getAttribute(attr) === val)); }

document.addEventListener('click', e => {
  const el = e.target.closest('button, a'); if (!el) {
    if (e.target.matches('.scrim')) e.target.remove();
    return;
  }
  const d = el.dataset;
  if (d.styleBtn) { document.documentElement.dataset.style = d.styleBtn; setPressed('data-style-btn', d.styleBtn); try { localStorage.setItem('ithub-style', d.styleBtn); } catch (_) {} return; }
  if (d.roleBtn) { S.role = d.roleBtn; S.ticket = null; S.staffJob = null; setPressed('data-role-btn', d.roleBtn); render(); window.scrollTo(0, 0); return; }
  if (d.go) { e.preventDefault(); S.page = d.go; S.ticket = null; S.staffJob = null; render(); window.scrollTo(0, 0); return; }
  if (d.ticket) { S.page = 'tickets'; S.ticket = +d.ticket; render(); window.scrollTo(0, 0); return; }
  if (el.hasAttribute('data-back')) { S.ticket = null; render(); return; }
  if (d.staffjob) { S.staffJob = +d.staffjob; render(); window.scrollTo(0, 0); return; }
  if (el.hasAttribute('data-sback')) { S.staffJob = null; render(); return; }
  if (d.tf) { S.tFilter = d.tf; render(); return; }
  if (d.inv) { S.invTab = d.inv; render(); return; }
  if (d.prio) { S.prio = +d.prio; setPressed('data-prio', d.prio); return; }
  if (d.as) { S.signinAs = d.as; render(); return; }
  if (el.hasAttribute('data-signin')) { S.role = S.signinAs; setPressed('data-role-btn', S.role); render(); toast('Signed in as ' + (S.role === 'tech' ? 'IT team' : 'staff')); return; }
  if (el.hasAttribute('data-toggle')) { el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') !== 'true'); return; }
  if (d.asset) { document.body.insertAdjacentHTML('beforeend', assetDrawer(ASSETS.find(a => a.id === d.asset))); return; }
  if (el.hasAttribute('data-close')) { el.closest('.scrim')?.remove(); return; }
  if (el.hasAttribute('data-scan')) {
    document.body.insertAdjacentHTML('beforeend', `<div class="scrim center" data-close><div class="modal" role="dialog" aria-label="Scan asset"><h2>Scan an asset label</h2><div class="scanner"><div class="frame"></div><div class="line"></div></div><p class="muted" style="font-size:.82rem">Point the camera at the QR label. In the real app this opens the item straight away.</p><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-scanhit>Simulate a scan</button></div></div></div>`);
    return;
  }
  if (el.hasAttribute('data-scanhit')) { el.closest('.scrim').remove(); S.page = 'inventory'; render(); document.body.insertAdjacentHTML('beforeend', assetDrawer(ASSETS[3])); return; }
  if (d.copy) {
    const txt = d.copy;
    const done = () => toast('Copied ' + txt);
    try { navigator.clipboard.writeText(txt).then(done, () => toast(txt)); } catch (_) { toast(txt); }
    return;
  }
  if (d.toast) { toast(d.toast); return; }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'raiseForm') { toast('Sent to IT as IT-1049'); S.page = 'myjobs'; render(); }
  if (e.target.id === 'signinForm') { S.role = S.signinAs; setPressed('data-role-btn', S.role); render(); }
});
$('#brandColor').addEventListener('input', e => document.documentElement.style.setProperty('--brand', e.target.value));
$('#brandName').addEventListener('input', () => render());

try { const s = localStorage.getItem('ithub-style'); if (s) { document.documentElement.dataset.style = s; setPressed('data-style-btn', s); } } catch (_) {}
const h = location.hash.slice(1);
if (NAV.tech.some(([k]) => k === h)) S.page = h;
if (NAV.staff.some(([k]) => k === h)) { S.role = 'staff'; S.page = h; setPressed('data-role-btn', 'staff'); }
render();
</script>
